<title>Tractor Farm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }
</style>

<body>
<div id="hud"></div>
<script>
// surface runtime errors on-screen (handy on headless tests and kid devices)
function vtErr(msg) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;background:#c0392b;color:#fff;' +
    'font:13px monospace;padding:6px 8px;z-index:99;white-space:pre-wrap';
  d.textContent = 'ERROR: ' + msg;
  document.body.appendChild(d);
}
window.addEventListener('error', function (e) { vtErr((e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { vtErr('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>

} }
</script>
