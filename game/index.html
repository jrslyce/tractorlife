<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tractor Farm</title>
<link rel="preload" href="./fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: pinch-zoom; }
  html[data-text-scale="large"] { font-size: 112.5%; }
  html[data-text-scale="larger"] { font-size: 125%; }
  html[data-high-contrast="true"] { filter: contrast(1.15); }
  [hidden] { display: none !important; }
  /* in-world farm labels (one per farm, projected from a world anchor) */
  #farm-labels { position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 20; overflow: hidden; }
  .farm-label { position: absolute; left: 0; top: 0; display: none;
    background: rgba(19,27,21,.9); border: 2px solid #a9ca72;
    border-radius: 6px; padding: 3px 8px; color: #f5f5e8;
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
    font-weight: 600; line-height: 1.3; white-space: nowrap;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 2px 2px 0 rgba(0,0,0,.45); -webkit-user-select: none;
    user-select: none; will-change: transform; }
</style>
<link rel="stylesheet" href="./login.css">
</head>
<body>
<script>
window.VT_LOCKED = true; // input stays locked until the login gate opens
// surface runtime errors on-screen (handy on headless tests and kid devices)
function vtErr(msg) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;background:#c0392b;color:#fff;' +
    'font:13px monospace;padding:6px 8px;z-index:99;white-space:pre-wrap';
  d.textContent = 'ERROR: ' + msg;
  document.body.appendChild(d);
}
window.addEventListener('error', function (e) { vtErr((e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { vtErr('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
<section id="login" aria-label="Tractor Farm sign in">
  <div class="login-scenery" aria-hidden="true"><div class="login-sun"></div><div class="login-hill login-hill-back"></div><div class="login-hill login-hill-front"></div></div>
  <div class="login-content">
    <header class="login-title"><h1>Tractor Farm</h1><p class="sub">Hop on the tractor!</p></header>
    <div class="login-card">
      <div id="login-returning" hidden>
        <div id="login-initial" aria-hidden="true">F</div>
        <h2 id="login-returning-heading">Welcome back, farmer!</h2>
        <p id="login-returning-status">Your farm is ready when you are.</p>
        <button id="load-game" class="login-primary" type="button">Let's farm!</button>
        <button id="login-switch" type="button">Not you? Switch farmer</button>
      </div>
      <form id="login-form" novalidate>
        <h2 id="login-heading">Welcome back, farmer</h2>
        <div class="login-field"><label for="login-name">Name</label><input id="login-name" name="username" type="text" aria-describedby="login-msg" autocapitalize="words" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="e.g. Farmer Jo"></div>
        <div class="login-field"><label for="login-code">Password</label><div class="login-password"><input id="login-code" name="password" type="password" aria-describedby="login-msg" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="Your secret code"><button id="login-eye" type="button" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g id="login-eye-open"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></g><g id="login-eye-closed" hidden><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></g></svg></button></div></div>
        <label id="login-remember"><input id="login-remember-check" type="checkbox" checked><span class="login-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>Stay logged in</label>
        <button id="login-go" class="login-primary" type="submit">Let's farm!</button>
      </form>
      <p id="login-msg" role="status" aria-live="polite" aria-atomic="true"></p>
      <details id="graphics-start"><summary>Graphics quality <span id="graphics-current">Auto</span></summary><label for="login-graphics">Choose your graphics</label><select id="login-graphics" aria-describedby="graphics-help"><option value="auto">Auto</option><option value="low">Low · older devices</option><option value="balanced">Balanced</option><option value="high">High</option></select><p id="graphics-help">Choose Low for an iPad 6 or an older 4 GB laptop. All farming features stay available.</p></details>
    </div>
  </div>
  <p id="login-version"></p>
</section>
<noscript>This game needs JavaScript enabled.</noscript>
<script type="module" src="./dist/boot.js"></script>
<script type="module" src="./dist/version.js"></script>
</body>
</html>
