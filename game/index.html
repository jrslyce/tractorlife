<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tractor Farm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }
  #login { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 60;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column;
    flex-direction: column; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    background: rgba(38, 64, 26, .94); color: #fffbe8; padding: 24px;
    text-align: center; box-sizing: border-box; }
  #login h1 { font-size: 40px; margin: 0 0 6px; color: #ffe066; letter-spacing: 1px; }
  #login .sub { font-size: 17px; margin: 0 0 22px; color: #d8e8c8; }
  #login-form { display: -webkit-flex; display: flex; -webkit-flex-direction: column;
    flex-direction: column; width: 100%; max-width: 360px; }
  #login-form input { font-size: 20px; min-height: 56px; padding: 10px 16px;
    margin-bottom: 14px; border: 3px solid #2f4d1f; border-radius: 14px;
    background: #fffbe8; color: #233018; -webkit-appearance: none; appearance: none;
    box-sizing: border-box; width: 100%; text-align: center; }
  #login-go { min-height: 64px; padding: 0 32px; font-size: 24px; font-weight: 700;
    border: none; border-radius: 14px; background: #ffe066; color: #2f4d1f;
    box-shadow: 0 4px 0 #b8901a; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; }
  #login-go:active { -webkit-transform: translateY(3px); transform: translateY(3px);
    box-shadow: 0 1px 0 #b8901a; }
  #login-go[disabled] { opacity: .6; }
  #login-msg { min-height: 24px; font-size: 17px; font-weight: 600; margin: 16px 0 0;
    color: #ffb3a7; }
  #login-remember { display: -webkit-flex; display: flex; -webkit-align-items: center;
    align-items: center; gap: 8px; margin: 10px 0 0; font-size: 15px; color: #d8e8c8;
    -webkit-user-select: none; user-select: none; }
  #login-remember input { -webkit-appearance: none; appearance: none; width: 20px;
    height: 20px; border: 3px solid #2f4d1f; border-radius: 5px; background: #fffbe8;
    cursor: pointer; position: relative; flex-shrink: 0; }
  #login-remember input:checked { background: #ffe066; }
  #login-remember input:checked::after { content: '\2713'; position: absolute;
    left: 4px; top: -1px; font-size: 15px; font-weight: 700; color: #2f4d1f; }
  /* in-world farm labels (one per farm, projected from a world anchor) */
  #farm-labels { position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 20; overflow: hidden; }
  .farm-label { position: absolute; left: 0; top: 0; display: none;
    background: rgba(255, 251, 232, .92); border: 2px solid #2f4d1f;
    border-radius: 10px; padding: 3px 8px; color: #233018;
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
    font-weight: 600; line-height: 1.3; white-space: nowrap;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 0 rgba(0,0,0,.2); -webkit-user-select: none;
    user-select: none; will-change: transform; }
</style>
</head>
<body>
<script>
window.VT_LOCKED = true; // input stays locked until the login gate opens
// surface runtime errors on-screen (handy on headless tests and kid devices)
function vtErr(msg) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;background:#c0392b;color:#fff;' +
    'font:13px monospace;padding:6px 8px;z-index:99;white-space:pre-wrap';
  d.textContent = 'ERROR: ' + msg;
  document.body.appendChild(d);
}
window.addEventListener('error', function (e) { vtErr((e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { vtErr('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/version.js"></script>
<div id="login">
  <h1>🚜 Tractor Farm</h1>
  <p class="sub">Hop on the tractor!</p>
  <form id="login-form">
    <input id="login-email" type="email" inputmode="email" autocapitalize="none"
      autocorrect="off" spellcheck="false" autocomplete="off"
      placeholder="farmer@email.com">
    <input id="login-code" type="password" autocapitalize="none" autocorrect="off"
      spellcheck="false" autocomplete="current-password" placeholder="secret code">
    <button id="login-go" type="submit">LET'S FARM!</button>
    <label id="login-remember">
      <input id="login-remember-check" type="checkbox" checked>
      Stay logged in
    </label>
  </form>
  <p id="login-msg"></p>
</div>
</body>
</html>
