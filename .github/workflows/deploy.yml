name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy

      - name: Verify deployed game assets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for path in / /dist/boot.js /dist/version.js /game-ui.css; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "https://tractorlife.jaredsai96.workers.dev$path" -o /dev/null
          done

      - name: Skipping notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set - skipping deploy."
          echo "To enable auto-deploy run: gh secret set CLOUDFLARE_API_TOKEN"
